name: Validate Firebase Token

on:
  workflow_dispatch:

jobs:
  validate-token:
    runs-on: ubuntu-latest
    steps:
      - name: Validate FIREBASE_TOKEN presence
        shell: bash
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "Secret FIREBASE_TOKEN is missing"
            exit 1
          fi
          echo "FIREBASE_TOKEN is configured"
