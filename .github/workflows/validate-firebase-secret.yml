name: Validate Firebase Service Account Secret

on:
  workflow_dispatch:

jobs:
  validate-service-account:
    runs-on: ubuntu-latest
    steps:
      - name: Validate FIREBASE_SERVICE_ACCOUNT_STACKTRACKPRO
        shell: bash
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STACKTRACKPRO }}" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT_STACKTRACKPRO is missing"
            exit 1
          fi
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STACKTRACKPRO }}' > "$RUNNER_TEMP/firebase-key.json"
          node -e "const fs=require('fs');const p=process.env.RUNNER_TEMP+'/firebase-key.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(!j.client_email||!j.private_key||!j.project_id){throw new Error('Secret JSON missing required fields');}console.log('Service account secret is valid for project:', j.project_id);"
