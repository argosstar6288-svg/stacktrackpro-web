name: Validate Deploy OIDC Config

on:
  workflow_dispatch:

jobs:
  validate-oidc-config:
    runs-on: ubuntu-latest
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1043025959147/locations/global/workloadIdentityPools/github/providers/stacktrackpro
      GCP_DEPLOY_SERVICE_ACCOUNT: stacktrack-deployer@stacktrackpro.iam.gserviceaccount.com
    steps:
      - name: Validate Required OIDC Variables
        shell: bash
        run: |
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "Missing repo variable: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == *"REPLACE_WITH_PROJECT_NUMBER"* ]]; then
            echo "GCP_WORKLOAD_IDENTITY_PROVIDER still contains placeholder project number"
            exit 1
          fi
          if [ -z "$GCP_DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "Missing repo variable: GCP_DEPLOY_SERVICE_ACCOUNT"
            exit 1
          fi
          echo "OIDC deploy configuration variables are present."
