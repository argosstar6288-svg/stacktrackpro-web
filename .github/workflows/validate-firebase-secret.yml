name: Validate Firebase Deploy Config

on:
  workflow_dispatch:

jobs:
  validate-firebase-config:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Firebase CI Token
        run: |
          if [ -z "${{ secrets.FIREBASE_CI_TOKEN }}" ]; then
            echo "❌ FIREBASE_CI_TOKEN secret is not set in GitHub repository"
            echo "See deployment instructions: https://firebase.google.com/docs/hosting/github-integration"
            exit 1
          fi
          echo "✅ FIREBASE_CI_TOKEN is configured"

      - name: Summary
        run: |
          echo "## Deploy Configuration Status" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Firebase Project ID: stacktrackpro" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ FIREBASE_CI_TOKEN: Configured" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next: Push to main branch to trigger deployment" >> $GITHUB_STEP_SUMMARY
